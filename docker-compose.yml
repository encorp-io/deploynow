services:
  deployer:
    # Pin a release (1.1.0) for predictable upgrades; latest = newest stable release.
    image: ghcr.io/encorp-io/deploynow:${DEPLOYNOW_TAG:-latest}
    # Or build locally:
    # build: .
    container_name: deploynow
    restart: unless-stopped
    labels:
      # DeployNow's own container holds AUTH_SECRET: its env is never shown and consoles are refused
      io.deploynow.self: "true"
    ports:
      - "${DEPLOYNOW_PORT:-9444}:9444"     # HTTPS — DeployNow dashboard (DEPLOYNOW_PORT picks the host port)
      - "8444:8444"     # Agent hub — remote agents connect out to this (mutual TLS)
    # The image runs as a non-root user. To manage this machine through the socket,
    # give it the socket's group: DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - deployer_data:/data          # SQLite DB + auto-generated TLS cert (persisted)
      # Manage the machine the deployer runs on. Remove to manage only remote machines.
      # Anyone with admin in the deployer effectively has root on this host.
      - /var/run/docker.sock:/var/run/docker.sock
      # ── Real certificate (optional) ─────────────────────────────────────────
      # Mount your certificate files here to replace the self-signed cert.
      # The entrypoint prefers /certs/ over the auto-generated cert in /data/certs/.
      #
      # - /path/to/your/cert.pem:/certs/cert.pem:ro
      # - /path/to/your/key.pem:/certs/key.pem:ro
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      # Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET}

      # First-boot admin credentials (only used when no users exist in DB).
      # Remove ADMIN_PASSWORD from .env after the first start (setup.sh does) and run
      # docker compose up -d: until then docker inspect shows it.
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # required on first boot, min 12 chars

      # SQLite database (inside /data volume)
      DATABASE_URL: file:/data/deployer.db

      # Public URL of this deployer instance (used for invite links and auth callbacks).
      # Set this to your server's actual URL, e.g. https://164.90.232.75:9444
      # If unset, auth and redirects derive the URL from the incoming request headers.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      # Serve the UI on a domain from the first start: DeployNow starts Traefik on ports
      # 80/443, gets a Let's Encrypt certificate (sent to ACME_EMAIL) and switches to the
      # domain once it answers. Same as Settings → Domain; setup.sh asks for it.
      DEPLOYNOW_DOMAIN: ${DEPLOYNOW_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TLS_HOSTNAME: ${TLS_HOSTNAME:-}

      # Two-factor sign-in is optional. "true" makes admins and owners set it up on a new
      # install (only read on the first start; change it later under Settings → Security and sign-in).
      REQUIRE_2FA: ${REQUIRE_2FA:-false}

      # A domain set under Settings → Domain (served through Traefik with Let's Encrypt)
      # takes precedence. Port 9444 keeps working either way. To bypass a stored
      # domain without the UI:
      # IGNORE_PLATFORM_DOMAIN: "true"

      # Address agents dial (defaults to NEXTAUTH_URL's host on AGENT_PORT). Can also be set in Settings.
      # AGENT_PUBLIC_URL: https://deploynow.example.com:8444
      # AGENT_PORT: "8444"   # "off" disables the agent hub

      # Update DeployNow from Settings → Updates (a helper container swaps it, checks health
      # and rolls back). Needs the Docker socket above. "off" hides it:
      # DEPLOYNOW_SELF_UPDATE: "off"

      # ── GitHub Container Registry (optional — can also configure in web UI) ─
      # Your GitHub username + PAT with read:packages scope
      GITHUB_USER: ${GITHUB_USER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # GitHub Enterprise hosts that may also receive that token when cloning (comma separated)
      GITHUB_HOSTS: ${GITHUB_HOSTS:-}

      # ── TLS certificate (optional) ──────────────────────────────────────────
      # Leave unset to use the auto-generated self-signed cert.
      # Set both to paths inside a mounted volume to use a real certificate.
      # CERT_FILE: /certs/cert.pem
      # KEY_FILE:  /certs/key.pem

      # TLS_HOSTNAME (above): custom hostname added to the self-signed cert's SAN

volumes:
  deployer_data:
    driver: local
