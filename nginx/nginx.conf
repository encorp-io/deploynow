# ── Encorp Deployer — nginx SSL termination proxy ────────────────────────────
# Runs as a non-root user (nextjs) inside the container.
# All temp/log dirs are set to paths owned by nextjs.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

# Must be "off" so we can manage the process from the entrypoint script
daemon off;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Temp paths writable by non-root nextjs user
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;  # don't reveal nginx version

    # Browsers send every cookie for a host on every port, so on localhost the
    # cookies of other local apps arrive here too. nginx's default (8k per header
    # line) answers 400 "Request Header Or Cookie Too Large" long before that's a
    # real problem. Node is started with a matching --max-http-header-size.
    large_client_header_buffers 4 32k;
    proxy_buffer_size           32k;
    proxy_buffers               4 32k;
    proxy_busy_buffers_size     64k;

    # Written by docker-entrypoint.sh at every start:
    #   $dn_from_proxy  1 when the request carries Traefik's X-DeployNow-Proxy-Auth
    #                   secret (added by the UI route's middleware), else 0
    #   $dn_cert_hsts   the HSTS value for :9444, empty with the self-signed cert
    map_hash_bucket_size 128;  # room for the 64-character secret as a map key
    include /tmp/nginx-runtime.conf;

    # Headers on the plain-HTTP listener below are trusted only from Traefik. Any
    # app container on the proxy network can reach :9080 directly, so without the
    # secret the client address is the TCP peer and the scheme is http.
    map "$dn_from_proxy:$http_x_real_ip" $dn_real_ip {
        "~^1:(?<dn_fwd_ip>[0-9A-Fa-f:.]{2,45})$" $dn_fwd_ip;
        default                                $remote_addr;
    }
    map "$dn_from_proxy:$http_x_forwarded_proto" $dn_fwd_proto {
        "1:https" https;
        default   http;
    }
    # HSTS for the platform domain: only on HTTPS that Traefik terminated
    map $dn_fwd_proto $dn_proxy_hsts {
        https   "max-age=31536000";
        default "";
    }

    # ── HTTPS server ───────────────────────────────────────────────────────────
    server {
        listen 9444 ssl;
        server_name _;

        # Cert paths — populated by docker-entrypoint.sh
        ssl_certificate     /data/certs/cert.pem;
        ssl_certificate_key /data/certs/key.pem;

        # Modern TLS — TLS 1.2 minimum, TLS 1.3 preferred
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # Only with a real certificate: HSTS on a self-signed one would stop
        # browsers from letting anyone click past the warning. An empty value
        # sends no header.
        add_header Strict-Transport-Security $dn_cert_hsts always;

        # ── Container console WebSocket (internal :3002) ────────────────────
        location /ws/ {
            proxy_pass         http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-DeployNow-Proxy-Auth "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Proxy to Next.js on internal loopback port ──────────────────────
        location / {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;

            # Pass the full original Host header (includes port)
            # $http_host = "164.90.232.75:9444" (preserves port)
            # $host = "164.90.232.75" (strips port)
            proxy_set_header Host              $http_host;
            proxy_set_header X-DeployNow-Proxy-Auth "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  9444;

            # WebSocket support (Next.js dev HMR / server-sent events)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Don't buffer — needed for SSE / streaming responses
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }
    }

    # ── Plain HTTP for Traefik (Settings → Domain) ─────────────────────────────
    # Traefik on the proxy network terminates TLS for the platform domain and
    # forwards here. This port is not published on the host; only containers on
    # DeployNow's Docker networks can reach it.
    server {
        listen 9080;
        server_name _;

        add_header Strict-Transport-Security $dn_proxy_hsts always;

        location /ws/ {
            proxy_pass         http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-DeployNow-Proxy-Auth "";
            proxy_set_header X-Real-IP         $dn_real_ip;
            proxy_set_header X-Forwarded-For   $dn_real_ip;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Proto $dn_fwd_proto;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-DeployNow-Proxy-Auth "";
            proxy_set_header X-Real-IP         $dn_real_ip;
            proxy_set_header X-Forwarded-For   $dn_real_ip;
            proxy_set_header X-Forwarded-Proto $dn_fwd_proto;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }
    }
}
