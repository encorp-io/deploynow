# ── Encorp Deployer — nginx SSL termination proxy ────────────────────────────
# Runs as a non-root user (nextjs) inside the container.
# All temp/log dirs are set to paths owned by nextjs.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

# Must be "off" so we can manage the process from the entrypoint script
daemon off;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Temp paths writable by non-root nextjs user
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;  # don't reveal nginx version

    # ── HTTPS server ───────────────────────────────────────────────────────────
    server {
        listen 9444 ssl;
        server_name _;

        # Cert paths — populated by docker-entrypoint.sh
        ssl_certificate     /data/certs/cert.pem;
        ssl_certificate_key /data/certs/key.pem;

        # Modern TLS — TLS 1.2 minimum, TLS 1.3 preferred
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # ── Proxy to Next.js on internal loopback port ──────────────────────
        location / {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket support (Next.js dev HMR / server-sent events)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Don't buffer — needed for SSE / streaming responses
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }
    }

    # ── Optional plain-HTTP redirect ────────────────────────────────────────
    # Uncomment this block if you also expose port 9443 or 80 and want
    # to redirect HTTP → HTTPS automatically.
    #
    # server {
    #     listen 9443;
    #     server_name _;
    #     return 301 https://$host:9444$request_uri;
    # }
}
