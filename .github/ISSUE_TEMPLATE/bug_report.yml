name: Bug report
description: Something in DeployNow doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go through [private reporting](https://github.com/encorp-io/deploynow/security/advisories/new), not here.**
        Please remove secrets, tokens and domains you don't want public from logs.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an app from the image nginx:alpine
        2. Add the domain …
        3. Deploy
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DeployNow version
      description: Shown at the bottom of the sidebar and at /api/health.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: endpoint
    attributes:
      label: Endpoint type
      multiple: true
      options: [Local socket, SSH, Docker TLS, Agent, Not related to an endpoint]
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, CPU, Docker version (docker version), browser if it's a UI problem.
      placeholder: "Ubuntu 24.04, arm64, Docker 27.3, Firefox 133"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "docker logs deploynow --tail 100, or the deployment log."
      render: text
