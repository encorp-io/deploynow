name: Release

# Triggered when you push a semver tag: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Run CI first — don't release a broken build
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for changelog

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag v$TAG but package.json says $PKG: bump package.json first"; exit 1; }

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The section for this version in CHANGELOG.md, else the commits since the previous tag
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
            git log --pretty=format:"- %s (%h)" ${PREV_TAG:+$PREV_TAG..}HEAD > notes.md
          fi
          cat >> notes.md <<EOF

          ## Install or upgrade

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/setup.sh | sudo DEPLOYNOW_TAG=${VERSION} bash
          \`\`\`

          Or set \`DEPLOYNOW_TAG=${VERSION}\` in the \`.env\` next to your \`docker-compose.yml\` and run \`docker compose pull && docker compose up -d\`.
          The database is upgraded on start, and a copy is kept in \`/data/db-backups\`. Images: \`ghcr.io/${{ github.repository }}:${VERSION}\` and \`ghcr.io/${{ github.repository_owner }}/deploynow-agent:${VERSION}\` (amd64 and arm64).
          Both are signed with cosign; their digests are in \`image-digests.txt\` below. To check one:
          \`cosign verify ghcr.io/${{ github.repository }}:${VERSION} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@refs/tags/${GITHUB_REF_NAME}\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
